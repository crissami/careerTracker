<h1 class="text-3xl font-bold text-blue-600 p-8">careerTracker</h1>

@for (app of listApplications(); track app.id) {
  <p>{{ app.company }}</p>
  <p>{{ app.role }}</p>
  <button type="button" (click)="onDelete(app)">Delete</button>
} @empty {
  <p>You do not have any application yet!</p>
}

<app-application-form (saved)="onSaved($event)" />
