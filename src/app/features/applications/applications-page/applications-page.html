<div class="mb-6 flex flex-wrap items-center justify-between gap-4">
  <div>
    <h2 class="text-2xl font-semibold">Applications</h2>
    <p class="text-sm text-gray-500">{{ listApplications().length }} in total</p>
  </div>

  <div class="flex items-center gap-2">
    <button type="button" class="btn-secondary" (click)="changeView()">
      @if (view() === 'table') {
        <span aria-hidden="true">▦</span> Kanban
      } @else {
        <span aria-hidden="true">☰</span> Table
      }
    </button>
    <a routerLink="/new" class="btn-primary">+ New application</a>
  </div>
</div>

@if (view() === 'table') {
  <app-application-table
    [applications]="listApplications()"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)"
  />
} @else {
  <app-application-kanban
    [applications]="listApplications()"
    (edit)="onEdit($event)"
    (statusChange)="changeStatus($event)"
  />
}
