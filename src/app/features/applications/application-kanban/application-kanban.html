<div class="flex gap-4 overflow-x-auto p-4">
  @for (column of columns(); track column.status) {
    <section class="w-64 shrink-0 rounded-lg bg-gray-100 p-3">
      <h2 class="mb-3 text-sm font-semibold capitalize">
        {{ column.status }} ({{ column.items.length }})
      </h2>

      <div class="flex flex-col gap-2">
        @for (app of column.items; track app.id) {
          <button
            type="button"
            class="rounded-md bg-white p-3 text-left text-sm shadow-sm hover:shadow"
            (click)="edit.emit(app)"
          >
            <div class="font-medium">{{ app.company }}</div>
            <div class="text-gray-600">{{ app.role }}</div>
          </button>
        } @empty {
          <p class="text-xs text-gray-400">No applications</p>
        }
      </div>
    </section>
  }
</div>
