<div cdkDropListGroup class="flex gap-4 overflow-x-auto pb-4">
  @for (column of columns(); track column.status) {
    <section
      cdkDropList
      [cdkDropListData]="column.status"
      (cdkDropListDropped)="onDrop($event)"
      class="flex w-72 shrink-0 flex-col rounded-xl bg-gray-100 p-3"
    >
      <h3 class="mb-3 flex items-center justify-between px-1">
        <span class="badge" [attr.data-status]="column.status">{{ column.status }}</span>
        <span class="text-xs font-medium text-gray-500">{{ column.items.length }}</span>
      </h3>

      <div class="flex flex-col gap-2">
        @for (app of column.items; track app.id) {
          <button
            cdkDrag
            [cdkDragData]="app"
            type="button"
            class="cursor-grab rounded-lg border border-gray-200 bg-white p-3 text-left shadow-sm hover:border-blue-300 active:cursor-grabbing"
            (click)="edit.emit(app)"
          >
            <div class="flex items-start justify-between gap-2">
              <div class="text-sm font-medium">{{ app.company }}</div>
              <span class="badge" [attr.data-priority]="app.priority">{{ app.priority }}</span>
            </div>
            <div class="mt-1 text-sm text-gray-600">{{ app.role }}</div>
            @if (app.nextAction) {
              <div class="mt-2 text-xs text-gray-500">→ {{ app.nextAction }}</div>
            }
          </button>
        } @empty {
          <p
            class="rounded-lg border border-dashed border-gray-300 p-4 text-center text-xs text-gray-400"
          >
            Drop here
          </p>
        }
      </div>
    </section>
  }
</div>
