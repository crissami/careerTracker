<table class="w-full border-collapse text-sm">
  <thead>
    <tr class="border-b text-left">
      <th class="p-2">
        <button type="button" (click)="sortBy('company')">Company {{ arrow('company') }}</button>
      </th>
      <th class="p-2">
        <button type="button" (click)="sortBy('role')">Role {{ arrow('role') }}</button>
      </th>
      <th class="p-2">
        <button type="button" (click)="sortBy('status')">Status {{ arrow('status') }}</button>
      </th>
      <th class="p-2">
        <button type="button" (click)="sortBy('priority')">Priority {{ arrow('priority') }}</button>
      </th>
      <th class="p-2">
        <button type="button" (click)="sortBy('dateApplied')">
          Date applied {{ arrow('dateApplied') }}
        </button>
      </th>
      <th class="p-2">
        <button type="button" (click)="sortBy('nextAction')">
          Next action {{ arrow('nextAction') }}
        </button>
      </th>
      <th class="p-2"></th>
    </tr>
  </thead>
  <tbody>
    @for (app of sorted(); track app.id) {
      <tr class="border-b">
        <td class="p-2">{{ app.company }}</td>
        <td class="p-2">{{ app.role }}</td>
        <td class="p-2">{{ app.status }}</td>
        <td class="p-2">{{ app.priority }}</td>
        <td class="p-2">{{ app.dateApplied }}</td>
        <td class="p-2">{{ app.nextAction }}</td>
        <td class="p-2 flex gap-2">
          <button type="button" (click)="edit.emit(app)">Edit</button>
          <button type="button" (click)="delete.emit(app)">Delete</button>
        </td>
      </tr>
    } @empty {
      <tr>
        <td class="p-2" colspan="7">You do not have any application yet!</td>
      </tr>
    }
  </tbody>
</table>
